# Regime gate — highest evidence, lowest implementation cost of the plan's
# first four strategies. v0.1 gates entries on XLK/SMH trend only; the
# VXNCLS (Nasdaq vol, not bare "VXN" — that's not a valid FRED series ID)
# level, DFII10 20-day change, and QQQ/QQQE breadth terms from the full
# design are deferred until the strategy engine's feature layer can
# consume regime.py's data (VXNCLS/DFII10 are now fetched there via FRED,
# see quorum/dataflows/fred.py, but not yet exposed as a strategy Feature
# op) and options-implied vol is added — tracked as a follow-up, not
# silently dropped.
strategy_id: regime_gate
version: "0.1"
description: >
  Long TMT names only while both XLK (>200dma) and SMH (>50dma) confirm a
  risk-on trend; exit when XLK loses its 200dma. Position size is
  volatility-targeted per name, then scaled again by the prevailing
  regime classification (risk_on/risk_off/volatile/transition) as a
  portfolio-level exposure throttle.

universe:
  source: tag
  tags: [mega_cap_platforms, semis_design]

features:
  - name: xlk_sma200
    op: sma
    inputs: [XLK.close]
    window: 200
  - name: xlk_above_200dma
    op: gt
    inputs: [XLK.close, xlk_sma200]
  - name: xlk_below_200dma
    op: lt
    inputs: [XLK.close, xlk_sma200]
  - name: smh_sma50
    op: sma
    inputs: [SMH.close]
    window: 50
  - name: smh_above_50dma
    op: gt
    inputs: [SMH.close, smh_sma50]
  # Universe-wide vol proxy for sizing (find_atr_feature's documented
  # simplification: one ATR feature shared across every traded symbol,
  # not per-symbol vol targeting — that's flagged future work in
  # quorum/strategy/engine.py). SMH chosen over XLK since it's the
  # tighter proxy for this universe's semis-heavy composition. Without
  # this feature, vol_target sizing silently computes weight=0 for
  # every candidate (atr=None), which is exactly what shipped here
  # until this was caught in a live dry run of get_pod_candidates.
  # Known side effect of sharing one ATR across every symbol: since
  # weight = target_risk_pct / (atr/price) and atr is now constant
  # across symbols, weight ends up scaling with each stock's raw PRICE,
  # not its own volatility — this is allocation-by-price dressed up as
  # vol-targeting, not real per-symbol risk parity. max_position_pct
  # (0.15) and max_single_ticker_pct (0.20) bound the damage; true
  # per-symbol ATR is the actual fix, tracked as engine.py future work.
  - name: smh_atr14
    op: atr
    inputs: [SMH.high, SMH.low, SMH.close]
    window: 14

signal:
  direction: long_only
  entry:
    all_of: [xlk_above_200dma, smh_above_50dma]
  exit:
    any_of: [xlk_below_200dma]

sizing:
  method: vol_target
  target_risk_pct: 0.01
  atr_window: 14
  max_position_pct: 0.15

risk:
  regime_gate:
    risk_on: 1.0
    risk_off: 0.5
    volatile: 0.5
    transition: 0.75
  stop_loss_atr_mult: 2.0
  max_positions: 15
  max_single_ticker_pct: 0.20
  # Backstop, not a target hold time — this is a multi-week/month trend
  # follower that should mostly exit on xlk_below_200dma. One trading year
  # bounds the worst case where a risk-on regime just never breaks.
  max_holding_days: 252

execution:
  fill_timing: next_bar_open
  order_type: market
  cost_bps: 10
